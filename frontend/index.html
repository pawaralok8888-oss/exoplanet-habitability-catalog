<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exoplanet Habitability Catalog</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>MISSION CONTROL : EXOPLANETS</h1>
            <nav>
                <a href="index.html" class="active">Dashboard</a>
                <a href="star-explorer.html">Star Explorer</a>
            </nav>
        </header>

        <div class="controls">
            <button class="btn" id="btnAddPlanet">+ Add New Exoplanet</button>
            <button class="btn" id="btnFetchNasa">Fetch from NASA TAP</button>
        </div>

        <div class="glass-panel">
            <h2>Discovered Exoplanets</h2>
            <table id="planetsTable">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Host Star</th>
                        <th>Radius (Eu)</th>
                        <th>Mass (Eu)</th>
                        <th>Habitability Score</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Populated by JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal for Add/Edit -->
    <div class="modal-backdrop" id="planetModal">
        <div class="glass-panel modal">
            <h2 id="modalTitle">Add Exoplanet</h2>
            <form id="planetForm">
                <input type="hidden" id="planetId">
                <div class="form-group">
                    <label>Planet Name</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label>Star ID (Temporary text input)</label>
                    <input type="number" id="starId" value="1" required>
                </div>
                <div class="form-group">
                    <label>Radius (Earth Radii)</label>
                    <input type="number" step="0.01" id="radius">
                </div>
                <div class="form-group">
                    <label>Mass (Earth Masses)</label>
                    <input type="number" step="0.01" id="mass">
                </div>
                <div class="form-group">
                    <label>Orbital Period (Days)</label>
                    <input type="number" step="0.01" id="orbitalPeriod">
                </div>
                <div class="form-group">
                    <label>Equilibrium Temp (K)</label>
                    <input type="number" step="0.1" id="temp">
                </div>
                <div style="display:flex; gap:1rem; margin-top:1.5rem">
                    <button type="submit" class="btn">Save</button>
                    <button type="button" class="btn btn-danger" id="btnCancel">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
